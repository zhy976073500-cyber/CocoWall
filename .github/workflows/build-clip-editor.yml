# ClipEditor CI (CocoWall repo, branch clip-editor-probe):
# build an unsigned IPA for the probe in probes/clip-editor.
# Placement: this file must end up at .github/workflows/build-clip-editor.yml
# in this repo/branch. The GitHub App integration cannot push workflow files
# (403), so Sage adds it once via the web UI — copy this file's contents as-is.
name: Build ClipEditor IPA

on:
  push:
    branches: [clip-editor-probe]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: probes/clip-editor
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        run: |
          mkdir -p build
          { xcodebuild -version; echo; xcrun swift --version; echo; xcodegen --version; } > build/toolchain.txt
          cat build/toolchain.txt

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project ClipEditor.xcodeproj \
            -scheme ClipEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ClipEditor.app build/Payload/
          cp build/toolchain.txt build/Payload/ClipEditor.app/toolchain.txt
          cd build && zip -qr ClipEditor-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClipEditor-iOS-IPA
          path: probes/clip-editor/build/ClipEditor-unsigned.ipa
