.lg-xy-thumb{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;display:grid;place-items:center;background:#f4f8fce8;color:#25495a;box-shadow:0 2px 9px #122e4c40}
.lg-xy-thumb .lg-icon{width:18px;height:18px}
.lg-xy-slider[data-variant=lens] .lg-xy-thumb{width:74px;height:74px;background:#ffffff16;box-shadow:inset 0 1px 2px #ffffffb0,0 5px 18px -6px #20355355}
.webgl-ready .lg-xy-slider[data-variant=lens] .lg-xy-thumb{background:transparent;box-shadow:none}
.lg-xy-slider[data-variant=lens] .lg-xy-thumb .lg-icon{width:25px;height:25px}
.lg-xy-readout{display:block;font-size:13px;font-variant-numeric:tabular-nums;text-align:center;min-height:24px;margin:12px 0 4px}
.lg-xy-axes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:12px}
.lg-xy-axis{min-width:0;display:flex;gap:9px;align-items:center;font-size:12px}
.lg-xy-axis input{width:100%;min-width:0;height:32px;accent-color:#426f93;margin:0;cursor:ew-resize}
.lg-xy-axis>span{white-space:nowrap;flex-shrink:0}
.lg-xy-hint{text-align:center}
.lg-xy-slider[data-disabled=true]{opacity:.5}.lg-xy-slider[data-disabled=true] .lg-xy-pad{cursor:not-allowed}
@media(forced-colors:active){.lg-progress-track,.lg-drop-well,.lg-drop-selector,.lg-xy-pad{border:1px solid CanvasText}.lg-progress-fill{background:Highlight}.lg-drop-option[aria-checked=true]{outline:2px solid Highlight}.lg-xy-thumb{border:2px solid Highlight}.lg-xy-pad::before{display:block}}
@media(prefers-reduced-motion:reduce){.lg-stage *{transition-duration:0s!important;animation-duration:0s!important;scroll-behavior:auto!important}}
@media(prefers-reduced-motion:reduce){.lg-progress[data-motion=on][data-wave=true] .lg-progress-fiber path{animation-duration:3.6s!important}.lg-progress[data-motion=on] .lg-progress-fill{transition-duration:280ms,900ms!important}}

/* ===== CocoWall app layer (on top of Lens tokens + components) ===== */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
#phone {
  position: relative;
  max-width: 430px;
  height: 100dvh;
  margin: 0 auto;
  background: #fff;
  overflow: hidden;
}
@media (min-width: 500px) {
  #phone { box-shadow: 0 0 0 1px #e3e3e6, 0 0 80px rgba(0,0,0,.08); }
}
/* Lens stage becomes the full app shell: pure-white (#FFFFFF) Apple-style theme
   over its tokens. The wallpaper artwork survives only inside the Lens
   refraction texture at invisible strength — the page base stays pure white,
   and the glass cards and dock stand on it via light shadow and a fine edge. */
#stage {
  position: absolute; inset: 0;
  background: #fff;
  border-radius: 0;
  color: #1d1d1f;
  --lg-color-text: #1d1d1f;
  --lg-color-muted: #6e6e73;
  --lg-color-focus: #0071e3;
  --lg-surface-fallback: rgba(255,255,255,.55);
  --lg-surface-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 1px 0 0 rgba(255,255,255,.55), 0 12px 24px -12px rgba(31,38,52,.20);
  font: 16px/1.5 var(--lg-font-family);
}
#stage .lg-surface { color: #1d1d1f; }
#previewFrame .lg-surface { color: #fff; }
/* On pure white the glass needs a fine edge + soft shadow to stay legible,
   in WebGL mode too (where the Lens CSS shadow is switched off). */
#stage .wall-card, #stage .set-panel {
  box-shadow: inset 0 0 0 1px rgba(20,28,45,.055), 0 10px 24px -14px rgba(31,38,52,.28);
}

.scroll {
  position: absolute; inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px 132px;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin: 6px 2px 18px;
}
.page-head h1 {
  margin: 0; font-size: 34px; font-weight: 800; letter-spacing: .01em; line-height: 1.15;
}
#importHost .lg-button {
  min-height: 40px; padding: 0 16px; font-size: 14px; font-weight: 600; color: #0071e3;
  white-space: nowrap;
}

/* Wallpaper cards */
#cardList { display: flex; flex-direction: column; gap: 12px; }
.wall-card {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px; border-radius: 26px; cursor: pointer;
  text-align: left; width: 100%;
}
.wall-card:active { transform: scale(.985); }
.wall-thumb {
  width: 54px; height: 76px; flex: 0 0 auto;
  object-fit: cover; border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.16);
  background: #f0f0f2;
}
.wall-thumb-fallback {
  display: grid; place-items: center;
  color: #9a6200; font-size: 20px; font-weight: 700;
  background: linear-gradient(150deg, #ffe9c4, #ffd9d2);
}
.wall-meta { min-width: 0; flex: 1; }
.wall-title {
  font-size: 16px; font-weight: 650; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wall-sub {
  margin-top: 3px; font-size: 12.5px; color: #6e6e73; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wall-chevron { color: #b9b9be; font-size: 20px; font-weight: 300; flex: 0 0 auto; }
.list-foot { margin: 16px 4px 0; font-size: 12px; color: #86868b; }

/* Settings */
.group-label {
  margin: 22px 6px 8px; font-size: 13px; font-weight: 600; color: #86868b;
}
.group-label:first-of-type { margin-top: 2px; }
.set-panel { padding: 16px; border-radius: 26px; }
.set-row { display: flex; align-items: center; gap: 12px; }
.set-info { flex: 1; min-width: 0; }
.set-name { font-size: 15.5px; font-weight: 650; }
.set-status { margin-top: 2px; font-size: 12.5px; color: #6e6e73; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #c7c7cc; flex: 0 0 auto; }
.dot.on { background: #34c759; box-shadow: 0 0 8px rgba(52,199,89,.45); }
.set-panel .lg-button { min-height: 38px; padding: 0 15px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
#tunnelBtnHost { display: block; margin-top: 12px; }
#tunnelBtnHost .lg-button { width: 100%; min-height: 44px; font-size: 14.5px; white-space: normal; text-align: center; }
.tunnel-note { margin: 10px 2px 0; font-size: 12px; line-height: 1.55; color: #6e6e73; }
.rust-line { margin: 26px 6px 0; font-size: 12px; color: #aeaeb2; }

/* On-device pairing (iOS 27): numbered steps inside the card, start button,
   6-digit code row, honest prototype feedback, legacy file-import fallback */
.pair-steps { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.pair-steps li { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.55; color: #3a3a3c; }
.pair-steps .step-num { margin-top: 1px; }
#pairStartHost { display: block; margin-top: 14px; }
#pairStartHost .lg-button { width: 100%; min-height: 44px; font-size: 14.5px; white-space: normal; text-align: center; }
.pair-code-row { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
.pair-code-input {
  flex: 1; min-width: 0; height: 44px; padding: 0 14px;
  border-radius: 999px; border: 1px solid rgba(20,28,45,.14);
  background: rgba(255,255,255,.72);
  font-size: 15px; letter-spacing: .18em; color: #1d1d1f;
}
.pair-code-input::placeholder { letter-spacing: normal; font-size: 14px; color: #aeaeb2; }
.pair-code-input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,.18); }
#pairFinishHost { display: flex; }
#pairFinishHost .lg-button { min-height: 44px; }
.pair-feedback { margin: 10px 2px 0; font-size: 12.5px; line-height: 1.55; color: #8a5a00; }
.pair-fallback { margin: 14px 2px 0; font-size: 12px; color: #6e6e73; }
.pair-fallback button {
  background: none; border: 0; padding: 0; font: inherit;
  color: #0071e3; cursor: pointer;
}
.pair-fallback button:active { opacity: .6; }
#pairFileStatus { margin-left: 6px; color: #6e6e73; overflow-wrap: anywhere; }

/* Lens dock host: floating capsule above the home indicator area */
#dockHost {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(320px, calc(100% - 72px));
  z-index: 30;
}
#dockHost .lg-dock { width: 100%; }
#dockHost .lg-segment-bar {
  border-radius: 30px; padding: 5px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 18px 36px -14px rgba(31,41,55,.28);
}
#dockHost .lg-segment-option { color: #1d1d1f; min-height: 58px; }
#dockHost .lg-segment-indicator { height: 58px; border-radius: 25px; }
#dockHost .lg-icon { width: 23px; height: 23px; }

/* Lock-screen preview on a pure-white sheet: the quarter-screen phone frame
   sits centred in the upper area; below it a row of glass step chips
   (1 连接隧道 → 2 完成配对 → 3 应用壁纸) and, under the steps, the big
   应用壁纸 button. The frame is ~50% of the screen wide at a phone aspect
   ratio, so its area lands at roughly 1/4 of the full screen; every
   lock-screen element inside scales off the frame width via
   container-query units. */
#preview {
  position: absolute; inset: 0; z-index: 50; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #ffffff;
}
#preview[hidden] { display: none; }
#previewCol {
  display: flex; flex-direction: column; align-items: center;
  gap: 22px; padding: 20px 16px; max-width: 100%; max-height: 100%;
  overflow-y: auto; scrollbar-width: none;
}
#previewCol::-webkit-scrollbar { display: none; }
#previewFrame {
  position: relative; flex: 0 0 auto;
  width: min(50%, 40dvh);
  aspect-ratio: 9 / 19.2;
  border: 6px solid #17181b;
  border-radius: 32px;
  overflow: hidden;
  background: #000;
  container-type: inline-size;
  transform-origin: center center;
  will-change: transform, opacity;
  box-shadow:
    0 34px 70px -18px rgba(13, 18, 30, .5),
    0 14px 30px -12px rgba(13, 18, 30, .35),
    0 0 0 1px rgba(255, 255, 255, .35);
}
#previewImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
#previewFallback {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 10cqw;
  background: radial-gradient(120% 90% at 70% 10%, #4b2a6e 0%, #1c1030 45%, #07070d 100%);
  color: #e9e4f5; font-size: 7cqw; text-align: center; word-break: break-all;
}
#previewShade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.28), transparent 30%, transparent 62%, rgba(0,0,0,.38));
}
#closePreview {
  position: absolute; left: 5.5cqw; top: 5cqw;
  width: 15cqw; height: 15cqw; border-radius: 50%;
  display: grid; place-items: center; color: #fff; z-index: 3;
  border: 0; cursor: pointer; padding: 0;
}
#closePreview svg { width: 46%; height: 46%; }
.lock-clock {
  position: absolute; left: 0; right: 0; z-index: 2; text-align: center; color: #fff;
  top: 11%;
  text-shadow: 0 2px 18px rgba(0,0,0,.35); pointer-events: none;
}
.lock-date { font-size: 4.6cqw; font-weight: 600; letter-spacing: .02em; }
.lock-time {
  font-size: 20.5cqw; font-weight: 800; line-height: 1.02; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.lock-bottom {
  position: absolute; left: 0; right: 0; z-index: 3;
  bottom: 4.5%;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 8.5cqw;
}
.lock-round {
  width: 12.5cqw; height: 12.5cqw; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; color: #fff;
  border: 0; cursor: pointer; padding: 0;
}
.lock-round svg { width: 52%; height: 52%; }

/* Steps row under the frame: small glass chips with numbered dots */
.preview-steps {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; flex-wrap: wrap;
}
.step-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; color: #1d1d1f; white-space: nowrap;
}
#preview .step-chip {
  box-shadow: inset 0 0 0 1px rgba(20,28,45,.055), 0 8px 18px -10px rgba(31,38,52,.25);
}
.step-num {
  display: grid; place-items: center; flex: 0 0 auto;
  width: 18px; height: 18px; border-radius: 50%;
  background: #0071e3; color: #fff; font-size: 11px; font-weight: 700;
}
.step-arrow { color: #b9b9be; font-size: 13px; }
button.step-chip { border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; }
button.step-chip:active { transform: scale(.97); }

/* Big apply button under the steps (disabled until writing lands) */
.preview-apply { display: flex; flex-direction: column; align-items: center; gap: 9px; }
#applyBtn {
  min-width: 224px; min-height: 52px; padding: 0 36px;
  border-radius: 999px; font-size: 16.5px; font-weight: 700; color: #1d1d1f;
}
#preview #applyBtn {
  box-shadow: inset 0 0 0 1px rgba(20,28,45,.055), 0 14px 28px -12px rgba(31,38,52,.30);
}
.apply-note { margin: 0; font-size: 12px; color: #86868b; }

    </style>

// One input-modality listener set per document, shared by independently mounted stages.
const focusDocuments = new WeakMap();

  const element = root.nodeType === 9 ? root.documentElement : root;

  let record = focusDocuments.get(doc);
  if (!record) {
    const abort = new AbortController();
    record = {mode: 'pointer', roots: new Map(), abort};
    focusDocuments.set(doc, record);
    const setMode = mode => {
      if (record.mode === mode) return;
      record.mode = mode;
      for (const scope of record.roots.keys()) scope.setAttribute('data-lg-input', mode);
    };
    const hide = () => setMode('pointer');
    const options = {capture: true, passive: true, signal: abort.signal};
    doc.addEventListener('keydown', event => {
      if (!event.key || focusModifierKeys.has(event.key) || event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;

      if (event.repeat && record.mode !== 'keyboard') return;

    for (const event of ['pointermove', 'pointerdown', 'wheel', 'touchstart', 'touchmove']) {
      doc.addEventListener(event, hide, options);
    }

    doc.defaultView?.addEventListener('blur', hide, {...options, capture: false});
    doc.addEventListener('visibilitychange', () => { if (doc.hidden) hide(); }, options);
  }
  let entry = record.roots.get(element);
  if (!entry) {
    entry = {count: 0, previous: element.getAttribute('data-lg-input')};
    record.roots.set(element, entry);
  }
  entry.count++;
  element.setAttribute('data-lg-input', record.mode);
  let active = true;
  return () => {
    if (!active) return;
    active = false;
    if (--entry.count === 0) {
      if (entry.previous === null) element.removeAttribute('data-lg-input');
      else element.setAttribute('data-lg-input', entry.previous);
      record.roots.delete(element);
    }
    if (!record.roots.size) { record.abort.abort(); focusDocuments.delete(doc); }
  };

  function updateFoot() {
    listFoot.textContent = '共 ' + cardList.children.length + ' 个交互壁纸';
  }

  function makeCard(item) {
    var panel = Lens.createComponent('panel', { label: item.title, motion: 'none', children: [] });
    var el = panel.element;
    el.classList.add('wall-card');
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    if (item.img) {
      var img = document.createElement('img');
      img.className = 'wall-thumb'; img.src = item.img; img.alt = item.title + ' 缩略图';
      el.appendChild(img);
    } else {
      var fb = document.createElement('div');
      fb.className = 'wall-thumb wall-thumb-fallback';
      fb.textContent = (item.title || 'W').slice(0, 1).toUpperCase();
      el.appendChild(fb);
    }
    var meta = document.createElement('div'); meta.className = 'wall-meta';
    var t = document.createElement('div'); t.className = 'wall-title'; t.textContent = item.title;
    var s = document.createElement('div'); s.className = 'wall-sub'; s.textContent = item.sub;
    meta.append(t, s);
    var chev = document.createElement('span'); chev.className = 'wall-chevron'; chev.textContent = '›';
    el.append(meta, chev);
    function open() { openPreview(item, el.querySelector('.wall-thumb') || el); }
    el.addEventListener('click', open);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    return el;
  }

  wallpapers.forEach(function (item) { cardList.appendChild(makeCard(item)); });
  updateFoot();

  /* ---------- Import .tendies (web: file picker, card appended) ---------- */
  var tendiesInput = document.getElementById('tendiesInput');
  var importBtn = Lens.createComponent('button', {
    label: '导入 .tendies',
    onPress: function () { tendiesInput.click(); }
  });
  document.getElementById('importHost').appendChild(importBtn.element);
  tendiesInput.addEventListener('change', function () {
    var file = tendiesInput.files && tendiesInput.files[0];
    if (!file) return;
    var title = file.name.replace(/\.tendies$/i, '') || file.name;
    cardList.appendChild(makeCard({ title: title, sub: '本地导入 · ' + file.name, img: null, hero: null, fileName: file.name }));
    updateFoot();
    refreshGlass();
    tendiesInput.value = '';
  });

  function settingsPanel(label) {
    var p = Lens.createComponent('panel', { label: label, motion: 'none', children: [] });
    p.element.classList.add('set-panel');
    return p.element;
  }

    return { transform: 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px) scale(' + s.toFixed(3) + ')', scale: s };
  }

  function openPreview(item, sourceEl) {

    if (closeBtn.focus) { try { closeBtn.focus({ preventScroll: true }); } catch (e) {} }

    var frameRect = previewFrame.getBoundingClientRect();
    var sourceRect = liveSourceRect();

    var sourceRect = liveSourceRect();
    var to = sourceRect
      ? flipTransform(sourceRect, frameRect)

    var frameAnim = previewFrame.animate([

  function drawArtwork(ctx, dims) {
    var w = dims.width, h = dims.height;
    /* Pure-white page base (#FFFFFF): no warm/cool washes, no visible tint.
       The wallpaper art is painted into the Lens texture only as an internal
       refraction source, then buried under a near-opaque white finish, so it
       can bend light inside the glass but never colours the page itself. */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    try {
      if (heroArt.complete && heroArt.naturalWidth) {
        ctx.save();
        ctx.globalAlpha = 0.10;
        ctx.filter = 'blur(' + Math.round(36 * dims.dpr) + 'px) saturate(1.1) brightness(1.4)';
        var s = Math.max(w / heroArt.naturalWidth, (h * 0.55) / heroArt.naturalHeight) * 1.1;
        ctx.drawImage(heroArt, w - heroArt.naturalWidth * s * 0.88, -h * 0.05, heroArt.naturalWidth * s, heroArt.naturalHeight * s);
        ctx.restore();
      }
      if (stitchArt.complete && stitchArt.naturalWidth) {
        ctx.save();
        ctx.globalAlpha = 0.06;
        ctx.filter = 'blur(' + Math.round(38 * dims.dpr) + 'px) saturate(1.0) brightness(1.35)';
        var s2 = (w * 0.8) / stitchArt.naturalWidth;
        ctx.drawImage(stitchArt, -w * 0.2, h * 0.66, stitchArt.naturalWidth * s2, stitchArt.naturalHeight * s2);
        ctx.restore();
      }
    } catch (e) { /* artwork is only a refraction source; glass falls back gracefully */ }
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(255,255,255,0.97)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.985)');
    grad.addColorStop(1, 'rgba(255,255,255,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }

  var glassStarted = false;
  function initGlass() {
    if (glassStarted) return;
    glassStarted = true;
    try {
      glass = Lens.createGlassSystem(stage, {
        material: 'thick',
        scene: 'aurora',
        artwork: drawArtwork,
        audio: { enabled: true }
      });
      /* The renderer defaults to brightness .95, which greys the whole page
         to #F2F2F2; CocoWall's base must be pure #FFFFFF, so run the scene
         at full brightness. */
      if (glass && glass.renderer && glass.renderer.settings) {
        glass.renderer.settings.brightness = 1;
      }
    } catch (e) {
      stage.classList.add('fallback');
    }
  }
  if (heroArt.complete) initGlass();
  else heroArt.addEventListener('load', initGlass);
  /* If the hero image fails, still bring the glass system up with glows only. */
  heroArt.addEventListener('error', initGlass);
  stitchArt.addEventListener('load', function () { if (glass) { try { glass.setScene('aurora'); } catch (e) {} } });
})();
