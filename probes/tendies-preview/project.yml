name: TendiesPreview
options:
  bundleIdPrefix: com.coco
  # Xcode 15.0 project format (objectVersion 60), same as CocoWall/CocoFix:
  # newer Xcode (macos-26 / Xcode 26) opens this older format fine, older
  # toolchains cannot open xcode16_0 (objectVersion 77).
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TendiesPreview:
    type: application
    platform: iOS
    sources:
      - Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.tendiespreview
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Generate AppIcon from base64
        script: |
          ICON_DIR="$SRCROOT/Sources/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/icon-1024.png" ]; then
            base64 -D -i "$SRCROOT/Sources/App/icon-1024.b64" -o "$ICON_DIR/icon-1024.png" || openssl base64 -d -in "$SRCROOT/Sources/App/icon-1024.b64" -out "$ICON_DIR/icon-1024.png"
          fi
