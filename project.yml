name: CocoWall
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
options:
  bundleIdPrefix: com.coco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CocoWall:
    type: application
    platform: iOS
    sources:
      - Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Generate AppIcon from base64
        script: |
          ICON_DIR="$SRCROOT/Sources/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/icon-1024.png" ]; then
            base64 -D -i "$SRCROOT/Sources/App/icon-1024.b64" -o "$ICON_DIR/icon-1024.png" || openssl base64 -d -in "$SRCROOT/Sources/App/icon-1024.b64" -out "$ICON_DIR/icon-1024.png"
          fi
    dependencies:
      - target: CocoWallTunnel
        embed: true
      - package: ZIPFoundation
  CocoWallTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall.Tunnel
        INFOPLIST_FILE: Sources/Tunnel/Info.plist
