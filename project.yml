name: CocoWall
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
options:
  bundleIdPrefix: com.coco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CocoWall:
    type: application
    platform: iOS
    sources:
      - Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust-core/include
        OTHER_LDFLAGS[sdk=iphoneos*]: $(SRCROOT)/rust-core/target/aarch64-apple-ios/release/libcocowall_core.a
    preBuildScripts:
      - name: Build Rust core (libcocowall_core.a)
        script: |
          bash "$SRCROOT/ci/build-rust-core.sh"
      - name: Generate AppIcon from base64
        script: |
          ICON_DIR="$SRCROOT/Sources/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/icon-1024.png" ]; then
            base64 -D -i "$SRCROOT/Sources/App/icon-1024.b64" -o "$ICON_DIR/icon-1024.png" || openssl base64 -d -in "$SRCROOT/Sources/App/icon-1024.b64" -out "$ICON_DIR/icon-1024.png"
          fi
      - name: Generate bundled Grappa token
        script: |
          # Mint a Grappa token on this (macOS) build host with
          # tools/grappa-gen and embed it in the app bundle as
          # GrappaToken.txt. It is the in-app helper's LAST-RESORT fallback
          # only — runtime generation always runs first (see
          # Sources/App/GrappaHelper.m). Generation failure must be loud
          # but must NOT block the build: a GRAPPA-GEN FAILURE banner and an
          # error: line go into the build log, no token file is embedded,
          # and the app then behaves exactly like the runtime-only build
          # (its own log also reports the missing bundled token).
          #
          # Debug round 3 (grappa-gen-macos-target): runs #26-#28 died
          # with SIGKILL (exit 137) before main() - even a trivial C
          # hello, so the code was never at fault. Run #28's unified log
          # gave the root cause: AMFI rejected the binaries ("unsuitable
          # CT policy ... rejecting signature") because they had been
          # compiled as iOS binaries (LC_BUILD_VERSION platform 2,
          # minos 17.0) - this script runs inside the iOS target's
          # build, so a bare clang inherited SDKROOT=iphoneos. The fix:
          # every tool compiled here is pinned to the macOS SDK plus an
          # explicit arm64-apple-macos14.0 target, and each binary's
          # LC_BUILD_VERSION is self-checked right after compilation
          # (platform must be 1 = MACOS; anything else is a hard stop
          # for that binary, never a silent continue). A trivial C
          # canary (tools/grappa-gen/bisect/hello.c) is compiled and run
          # FIRST on every build, so an environment / execution-policy
          # problem stays distinguishable from a generator problem at a
          # glance; the ObjC bisect variants (bisect/hello_foundation.m,
          # bisect/hello_dlopen.m) are no longer executed - their
          # sources stay in the repo. Tools still run under the 20s
          # watchdog and write MARK lines to a diag file via
          # write()+fsync (MARK 0 = first statement of main). The script
          # also probes the effective ENABLE_USER_SCRIPT_SANDBOXING
          # value in the generated pbxproj and collects forensics
          # (DiagnosticReports + a bounded unified log query for amfid /
          # the tool names) for the report.
          echo "=== GRAPPA-GEN ENV: host probe begin"
          uname -a || true
          echo "=== GRAPPA-GEN ENV: uname -m = $(uname -m)"
          sw_vers || true
          xcodebuild -version 2>/dev/null | head -n 2 || true
          echo "=== GRAPPA-GEN ENV: hw.memsize = $(sysctl -n hw.memsize 2>/dev/null || echo unknown)"
          vm_stat 2>/dev/null | head -n 6 || true
          csrutil status 2>&1 || true
          for FW in AirTrafficDevice AirTrafficHost; do
            echo "=== GRAPPA-GEN ENV: contents of /System/Library/PrivateFrameworks/$FW.framework:"
            ls -la "/System/Library/PrivateFrameworks/$FW.framework/" 2>&1 | head -n 10
          done
          if [ -n "${PROJECT_FILE_PATH:-}" ] && [ -f "$PROJECT_FILE_PATH/project.pbxproj" ]; then
            echo "=== GRAPPA-GEN ENV: ENABLE_USER_SCRIPT_SANDBOXING in generated project.pbxproj:"
            grep -n "ENABLE_USER_SCRIPT_SANDBOXING" "$PROJECT_FILE_PATH/project.pbxproj" || echo "(setting absent from pbxproj - Xcode default applies)"
          else
            echo "=== GRAPPA-GEN ENV: PROJECT_FILE_PATH unavailable - cannot inspect generated pbxproj"
          fi
          echo "=== GRAPPA-GEN ENV: host probe end"
          GEN_DIR="$SRCROOT/build/grappa-gen"
          mkdir -p "$GEN_DIR"
          BIS_DIR="$GEN_DIR/bisect"
          mkdir -p "$BIS_DIR"
          GEN_SRC="$SRCROOT/tools/grappa-gen/main.m"
          GEN_BIN="$GEN_DIR/grappa-gen"
          GEN_HEX="$GEN_DIR/GrappaToken.txt"
          GEN_DIAG="$GEN_DIR/diag.log"
          GEN_RUNLOG="$GEN_DIR/run.log"
          GEN_TOKOUT="$GEN_DIR/token.out"
          GEN_SAMPLE="$GEN_DIR/sample.txt"
          GEN_CC="$(xcrun --sdk macosx --find clang 2>/dev/null || echo clang)"
          GEN_SDK_PATH="$(xcrun --sdk macosx --show-sdk-path 2>/dev/null)"
          GEN_MACOS_TARGET="arm64-apple-macos14.0"
          echo "=== GRAPPA-GEN ENV: macosx SDK path = ${GEN_SDK_PATH:-UNRESOLVED}"
          echo "=== GRAPPA-GEN ENV: pinned compile target = $GEN_MACOS_TARGET (every tool's LC_BUILD_VERSION platform must be 1 = MACOS)"
          grappa_gen_fail() {
            echo "======================================================================"
            echo "=== GRAPPA-GEN FAILURE: $1"
            echo "=== Building WITHOUT a bundled Grappa token (GrappaToken.txt)."
            echo "=== The app will rely on runtime Grappa generation only."
            echo "======================================================================"
            echo "error: GRAPPA-GEN FAILURE: $1 - building without bundled GrappaToken.txt"
            if [ -n "${TARGET_BUILD_DIR:-}" ] && [ -n "${UNLOCALIZED_RESOURCES_FOLDER_PATH:-}" ]; then
              rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GrappaToken.txt"
            fi
          }
          # check_platform LABEL BIN: prints the binary's
          # LC_BUILD_VERSION block and sets PLAT_OK=1 only when its
          # platform field is 1 (MACOS). An iOS-platform (2) binary
          # here is exactly the run #28 failure mode: macOS AMFI kills
          # it before main() with "unsuitable CT policy". Callers must
          # treat PLAT_OK != 1 as a hard stop for that binary.
          check_platform() {
            CP_LABEL="$1"; CP_BIN="$2"
            PLAT_OK=0
            PLAT_VAL="$(otool -l "$CP_BIN" 2>/dev/null | awk '/LC_BUILD_VERSION/{seen=1; next} seen && /platform/{print $2; exit}')"
            echo "=== PLATFORM CHECK $CP_LABEL: LC_BUILD_VERSION platform=${PLAT_VAL:-unknown} (required: 1 = MACOS)"
            otool -l "$CP_BIN" 2>/dev/null | grep -A4 "LC_BUILD_VERSION" | head -n 6 || true
            if [ "$PLAT_VAL" = "1" ]; then
              PLAT_OK=1
            else
              echo "=== PLATFORM CHECK $CP_LABEL: WRONG PLATFORM - refusing to run a non-macOS binary on the macOS build host (run #28 AMFI kill mode)"
            fi
          }
          # run_tool LABEL BIN DIAG OUT ERRLOG SAMPLE
          # Runs BIN with argv[1]=DIAG in the background under a 20s
          # watchdog (stack sample before the kill on timeout), then
          # cats stdout/stderr/diag. Sets RT_RC and RT_TIMEOUT.
          run_tool() {
            RT_LABEL="$1"; RT_BIN="$2"; RT_DIAG="$3"; RT_OUT="$4"; RT_ERR="$5"; RT_SAMPLE="$6"
            rm -f "$RT_DIAG" "$RT_ERR" "$RT_OUT" "$RT_SAMPLE"
            "$RT_BIN" "$RT_DIAG" >"$RT_OUT" 2>"$RT_ERR" &
            RT_PID=$!
            RT_TIMEOUT=0
            RT_TICKS=0
            while :; do
              RT_STAT="$(ps -p "$RT_PID" -o stat= 2>/dev/null)"
              if [ -z "$RT_STAT" ]; then
                break
              fi
              case "$RT_STAT" in
                *Z*) break ;;
              esac
              if [ "$RT_TICKS" -ge 40 ]; then
                RT_TIMEOUT=1
                echo "=== WATCHDOG: $RT_LABEL pid $RT_PID still alive after 20s - sampling stack, then killing"
                sample "$RT_PID" 3 -file "$RT_SAMPLE" >/dev/null 2>&1 || true
                kill -9 "$RT_PID" 2>/dev/null || true
                break
              fi
              sleep 0.5
              RT_TICKS=$((RT_TICKS + 1))
            done
            wait "$RT_PID" 2>/dev/null
            RT_RC=$?
            echo "=== RUN $RT_LABEL: exit code $RT_RC watchdog_timeout=$RT_TIMEOUT"
            echo "--- $RT_LABEL stderr:"
            cat "$RT_ERR" 2>/dev/null || echo "(stderr file missing)"
            echo "--- $RT_LABEL diag file (MARK lines):"
            cat "$RT_DIAG" 2>/dev/null || echo "(diag file missing - process died before main?)"
            echo "--- $RT_LABEL stdout:"
            cat "$RT_OUT" 2>/dev/null || echo "(stdout file missing)"
            if [ -f "$RT_SAMPLE" ]; then
              echo "--- $RT_LABEL watchdog stack sample:"
              cat "$RT_SAMPLE"
            fi
          }
          # run_variant LABEL SRC MODE(c|objc): compile (macOS target
          # pinned) + platform self-check + binary info + run one tool
          # variant. Sets BV_COMPILE, BV_RC, BV_MARK0, BV_TO. A binary
          # whose LC_BUILD_VERSION platform is not 1 (MACOS) is NOT run.
          run_variant() {
            V_LABEL="$1"; V_SRC="$2"; V_MODE="$3"
            V_BIN="$BIS_DIR/$V_LABEL"
            V_DIAG="$BIS_DIR/$V_LABEL.diag"
            V_OUT="$BIS_DIR/$V_LABEL.out"
            V_ERR="$BIS_DIR/$V_LABEL.err"
            V_SAMPLE="$BIS_DIR/$V_LABEL.sample"
            BV_COMPILE="ok"; BV_RC="n/a"; BV_MARK0="n/a"; BV_TO="n/a"
            echo "=== VARIANT $V_LABEL: compiling $V_SRC (mode=$V_MODE, target=$GEN_MACOS_TARGET)"
            if [ "$V_MODE" = "objc" ]; then
              "$GEN_CC" -isysroot "$GEN_SDK_PATH" -target "$GEN_MACOS_TARGET" -fobjc-arc -fblocks -framework Foundation "$V_SRC" -o "$V_BIN" >"$BIS_DIR/$V_LABEL.clang.log" 2>&1
            else
              "$GEN_CC" -isysroot "$GEN_SDK_PATH" -target "$GEN_MACOS_TARGET" "$V_SRC" -o "$V_BIN" >"$BIS_DIR/$V_LABEL.clang.log" 2>&1
            fi
            if [ $? -ne 0 ]; then
              BV_COMPILE="FAIL"
              echo "=== VARIANT $V_LABEL: COMPILE FAILED:"
              cat "$BIS_DIR/$V_LABEL.clang.log"
              return 0
            fi
            echo "=== VARIANT $V_BIN: file:"
            file "$V_BIN" || true
            check_platform "$V_LABEL" "$V_BIN"
            if [ "$PLAT_OK" != "1" ]; then
              BV_COMPILE="WRONG-PLATFORM"
              echo "=== VARIANT $V_LABEL: NOT RUNNING - binary is not a macOS-platform binary"
              return 0
            fi
            echo "=== VARIANT $V_LABEL: codesign -dvvv:"
            codesign -dvvv "$V_BIN" 2>&1 | head -n 12 || true
            run_tool "$V_LABEL" "$V_BIN" "$V_DIAG" "$V_OUT" "$V_ERR" "$V_SAMPLE"
            BV_RC="$RT_RC"
            BV_TO="$RT_TIMEOUT"
            if grep -q "MARK 0" "$V_DIAG" 2>/dev/null; then BV_MARK0="yes"; else BV_MARK0="no"; fi
          }
          TOKEN_HEX=""
          GEN_RC="n/a"
          GEN_TIMEOUT="n/a"
          GEN_MARK0="n/a"
          BVC_COMPILE="n/a"; BVC_RC="n/a"; BVC_MARK0="n/a"; BVC_TO="n/a"
          if [ -z "$GEN_SDK_PATH" ]; then
            grappa_gen_fail "macosx SDK not found (xcrun --sdk macosx --show-sdk-path returned nothing) - cannot pin the macOS compile target"
            GEN_RC="no-macosx-sdk"
          else
            echo "=== CANARY begin: hello-c runs first on every build (environment canary)"
            run_variant "hello-c" "$SRCROOT/tools/grappa-gen/bisect/hello.c" "c"
            BVC_COMPILE="$BV_COMPILE"; BVC_RC="$BV_RC"; BVC_MARK0="$BV_MARK0"; BVC_TO="$BV_TO"
            echo "=== CANARY end: hello-c compile=$BVC_COMPILE run_exit=$BVC_RC mark0=$BVC_MARK0 watchdog_timeout=$BVC_TO"
            if ! "$GEN_CC" -isysroot "$GEN_SDK_PATH" -target "$GEN_MACOS_TARGET" -fobjc-arc -fblocks -framework Foundation "$GEN_SRC" -o "$GEN_BIN" >"$GEN_DIR/clang.log" 2>&1; then
              cat "$GEN_DIR/clang.log"
              grappa_gen_fail "generator compile failed (see clang output above)"
              GEN_RC="compile-fail"
            else
              echo "=== GRAPPA-GEN BINARY: file output:"
              file "$GEN_BIN" || true
              check_platform "grappa-gen" "$GEN_BIN"
              if [ "$PLAT_OK" != "1" ]; then
                grappa_gen_fail "grappa-gen compiled for the wrong platform (LC_BUILD_VERSION platform is not 1/MACOS - see PLATFORM CHECK above); refusing to run it"
                GEN_RC="wrong-platform"
              else
                echo "=== GRAPPA-GEN BINARY: codesign -dvvv output:"
                codesign -dvvv "$GEN_BIN" 2>&1 || true
                echo "=== GRAPPA-GEN BINARY: codesign --verify output:"
                codesign --verify --verbose=2 "$GEN_BIN" 2>&1 || true
                echo "=== GRAPPA-GEN RUN: the generator itself"
                run_tool "grappa-gen" "$GEN_BIN" "$GEN_DIAG" "$GEN_TOKOUT" "$GEN_RUNLOG" "$GEN_SAMPLE"
                GEN_RC="$RT_RC"
                GEN_TIMEOUT="$RT_TIMEOUT"
                if grep -q "MARK 0" "$GEN_DIAG" 2>/dev/null; then GEN_MARK0="yes"; else GEN_MARK0="no"; fi
                if [ "$GEN_RC" -ne 0 ]; then
                  grappa_gen_fail "generator exited with code $GEN_RC watchdog_timeout=$GEN_TIMEOUT (see grappa-gen MARK/diag lines above)"
                else
                  TOKEN_HEX="$(tr -d '[:space:]' <"$GEN_TOKOUT")"
                fi
              fi
            fi
          fi
          if [ -n "$TOKEN_HEX" ]; then
            case "$TOKEN_HEX" in
              *[!0-9a-fA-F]*)
                grappa_gen_fail "generator output was not pure hex"
                ;;
              *)
                printf '%s' "$TOKEN_HEX" > "$GEN_HEX"
                HEX_CHARS="$(printf '%s' "$TOKEN_HEX" | wc -c | tr -d ' ')"
                HEX_PREFIX="$(printf '%s' "$TOKEN_HEX" | cut -c 1-4)"
                if [ -n "${TARGET_BUILD_DIR:-}" ] && [ -n "${UNLOCALIZED_RESOURCES_FOLDER_PATH:-}" ]; then
                  BUNDLE_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
                  mkdir -p "$BUNDLE_DIR"
                  cp "$GEN_HEX" "$BUNDLE_DIR/GrappaToken.txt"
                  echo "=== GRAPPA-GEN OK: bundled Grappa token generated on build host and embedded as GrappaToken.txt (hex chars: $HEX_CHARS, prefix: $HEX_PREFIX)"
                else
                  grappa_gen_fail "TARGET_BUILD_DIR/UNLOCALIZED_RESOURCES_FOLDER_PATH unset - cannot locate app bundle"
                fi
                ;;
            esac
          fi
          echo "=== GRAPPA-GEN FORENSICS begin"
          echo "--- DiagnosticReports listing (/Library/Logs/DiagnosticReports):"
          ls -lt /Library/Logs/DiagnosticReports/ 2>/dev/null | head -n 10 || true
          echo "--- DiagnosticReports listing (~/Library/Logs/DiagnosticReports):"
          ls -lt "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null | head -n 10 || true
          for D in /Library/Logs/DiagnosticReports "$HOME/Library/Logs/DiagnosticReports"; do
            for f in "$D"/*.ips; do
              [ -f "$f" ] || continue
              case "$f" in
                *grappa*|*hello*)
                  echo "--- diagnostic report: $f"
                  head -n 50 "$f"
                  ;;
              esac
            done
          done
          echo "--- unified log query (amfid / grappa-gen / hello-c), last 3m, bounded to 15s:"
          FLOG="$GEN_DIR/forensics-unified.log"
          rm -f "$FLOG"
          log show --style compact --last 3m --predicate 'process == "amfid" OR eventMessage CONTAINS "grappa-gen" OR eventMessage CONTAINS "hello-c"' >"$FLOG" 2>&1 &
          LF_PID=$!
          LF_TICKS=0
          while kill -0 "$LF_PID" 2>/dev/null; do
            if [ "$LF_TICKS" -ge 30 ]; then
              echo "(log show still running after 15s - killing it; partial output follows)"
              kill -9 "$LF_PID" 2>/dev/null || true
              break
            fi
            sleep 0.5
            LF_TICKS=$((LF_TICKS + 1))
          done
          wait "$LF_PID" 2>/dev/null || true
          echo "unified log captured bytes: $(wc -c <"$FLOG" 2>/dev/null | tr -d ' ')"
          head -n 100 "$FLOG" 2>/dev/null || echo "(no unified log output captured - permissions/environment may restrict log show in the build sandbox)"
          echo "=== GRAPPA-GEN FORENSICS end"
          echo "=== GRAPPA-GEN SUMMARY begin"
          echo "canary hello-c:  compile=$BVC_COMPILE run_exit=$BVC_RC mark0=$BVC_MARK0 watchdog_timeout=$BVC_TO"
          echo "grappa-gen:      run_exit=$GEN_RC mark0=$GEN_MARK0 watchdog_timeout=$GEN_TIMEOUT"
          if [ "$BVC_RC" = "137" ] || [ "$GEN_RC" = "137" ]; then
            echo "=== 137 NOTE: a tool was SIGKILLed (exit 137) again. FIRST check the PLATFORM CHECK lines above (LC_BUILD_VERSION platform must be 1 = MACOS; the run #28 root cause was platform 2 = IOS binaries) and the AMFI 'unsuitable CT policy' lines in the forensics unified log - before suspecting the canary/generator code itself."
          fi
          echo "=== GRAPPA-GEN SUMMARY end"
          true
    dependencies:
      - target: CocoWallTunnel
        embed: true
      - package: ZIPFoundation
  CocoWallTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall.Tunnel
        INFOPLIST_FILE: Sources/Tunnel/Info.plist
