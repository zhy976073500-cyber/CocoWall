name: CocoWall
options:
  bundleIdPrefix: com.coco
  # Generate the project in the Xcode 15.0 format (objectVersion 60).
  # XcodeGen's default is xcode16_0 (objectVersion 77), which Xcode 15.4
  # on the macos-14 runner cannot open ("future Xcode project file
  # format (77)") - run #34 died before any build phase ran, so the
  # pre-build scripts (Rust core, grappa-gen) never executed. Newer
  # Xcode (macos-26 / Xcode 26) opens this older format fine.
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.9"
    CURRENT_PROJECT_VERSION: "10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CocoWall:
    type: application
    platform: iOS
    sources:
      - Sources/App
    dependencies:
      # WidgetKit extension hosting the pairing Live Activity
      # (Dynamic Island + lock-screen banner). Built and embedded
      # into the .app by the normal app scheme build, so the CI
      # packaging step picks it up without workflow changes.
      - target: PairingLiveActivity
        embed: true
      # Built-in loopback packet tunnel (run #125). Same embed pattern
      # as the Live Activity extension: built and embedded into the
      # .app by the normal app scheme build, so the CI packaging step
      # picks it up without workflow changes.
      - target: CocoWallTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall
        INFOPLIST_FILE: Sources/App/Info.plist
        # NetworkExtension (packet-tunnel-provider) — required for the
        # app to install/drive the built-in loopback VPN configuration.
        CODE_SIGN_ENTITLEMENTS: Config/CocoWall.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust-core/include
        # Direct static-library link of the vendored AirliftFFI core
        # (upstream packages it as an xcframework instead); -lc++
        # mirrors upstream because the core pulls in C++ symbols.
        OTHER_LDFLAGS[sdk=iphoneos*]: $(SRCROOT)/rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a -lc++
    preBuildScripts:
      - name: Build Rust core (libairlift_ffi.a)
        script: |
          bash "$SRCROOT/ci/build-rust-core.sh"
      - name: Generate AppIcon from base64
        script: |
          ICON_DIR="$SRCROOT/Sources/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/icon-1024.png" ]; then
            base64 -D -i "$SRCROOT/Sources/App/icon-1024.b64" -o "$ICON_DIR/icon-1024.png" || openssl base64 -d -in "$SRCROOT/Sources/App/icon-1024.b64" -out "$ICON_DIR/icon-1024.png"
          fi
      - name: Generate author images from base64
        script: |
          # Same trick as the app icon (run #151): the author avatar,
          # official-account QR and reward-code jpgs live in the repo
          # as .b64 text (the push channel only carries text), decode
          # them into their imagesets here.
          ASSETS_DIR="$SRCROOT/Sources/App/Assets.xcassets"
          AVATAR_JPG="$ASSETS_DIR/authorAvatar.imageset/authorAvatar.jpg"
          if [ ! -f "$AVATAR_JPG" ]; then
            base64 -D -i "$SRCROOT/Sources/App/authorAvatar.jpg.b64" -o "$AVATAR_JPG" || openssl base64 -d -in "$SRCROOT/Sources/App/authorAvatar.jpg.b64" -out "$AVATAR_JPG"
          fi
          QR_JPG="$ASSETS_DIR/officialAccountQR.imageset/officialAccountQR.jpg"
          if [ ! -f "$QR_JPG" ]; then
            base64 -D -i "$SRCROOT/Sources/App/officialAccountQR.jpg.b64" -o "$QR_JPG" || openssl base64 -d -in "$SRCROOT/Sources/App/officialAccountQR.jpg.b64" -out "$QR_JPG"
          fi
          REWARD_JPG="$ASSETS_DIR/rewardCode.imageset/rewardCode.jpg"
          if [ ! -f "$REWARD_JPG" ]; then
            base64 -D -i "$SRCROOT/Sources/App/rewardCode.jpg.b64" -o "$REWARD_JPG" || openssl base64 -d -in "$SRCROOT/Sources/App/rewardCode.jpg.b64" -out "$REWARD_JPG"
          fi
  PairingLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Sources/PairingLiveActivity
      # ActivityAttributes schema shared with the app target (the app
      # picks this file up via its Sources/App directory source).
      - path: Sources/App/PairingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall.pairingliveactivity
        INFOPLIST_FILE: Sources/PairingLiveActivity/Info.plist
  # Packet Tunnel Provider extension hosting the built-in loopback
  # (run #125): hairpins traffic for the RSD endpoint 10.7.0.1 back
  # into the device so the Rust core can reach RemoteServiceDiscovery
  # without the external LocalDevVPN app.
  CocoWallTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Sources/CocoWallTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall.tunnel
        INFOPLIST_FILE: Sources/CocoWallTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CocoWallTunnel.entitlements
