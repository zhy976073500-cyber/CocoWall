name: CocoWall
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
options:
  bundleIdPrefix: com.coco
  # Generate the project in the Xcode 15.0 format (objectVersion 60).
  # XcodeGen's default is xcode16_0 (objectVersion 77), which Xcode 15.4
  # on the macos-14 runner cannot open ("future Xcode project file
  # format (77)") - run #34 died before any build phase ran, so the
  # pre-build scripts (Rust core, grappa-gen) never executed. Newer
  # Xcode (macos-26 / Xcode 26) opens this older format fine.
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CocoWall:
    type: application
    platform: iOS
    sources:
      - Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust-core/include
        OTHER_LDFLAGS[sdk=iphoneos*]: $(SRCROOT)/rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a
    preBuildScripts:
      - name: Build Rust core (libairlift_ffi.a)
        script: |
          bash "$SRCROOT/ci/build-rust-core.sh"
      - name: Generate AppIcon from base64
        script: |
          ICON_DIR="$SRCROOT/Sources/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/icon-1024.png" ]; then
            base64 -D -i "$SRCROOT/Sources/App/icon-1024.b64" -o "$ICON_DIR/icon-1024.png" || openssl base64 -d -in "$SRCROOT/Sources/App/icon-1024.b64" -out "$ICON_DIR/icon-1024.png"
          fi
      - name: Generate library cover images from base64
        script: |
          # Same trick as the app icon: the wallpaper-library cover
          # jpgs live in the repo as .b64 text (the push channel only
          # carries text), decode them into their imagesets here.
          ASSETS_DIR="$SRCROOT/Sources/App/Assets.xcassets"
          STITCH_JPG="$ASSETS_DIR/LibraryStitch.imageset/stitch.jpg"
          if [ ! -f "$STITCH_JPG" ]; then
            base64 -D -i "$SRCROOT/Sources/App/library-stitch.jpg.b64" -o "$STITCH_JPG" || openssl base64 -d -in "$SRCROOT/Sources/App/library-stitch.jpg.b64" -out "$STITCH_JPG"
          fi
          STAR_JPG="$ASSETS_DIR/LibraryStar.imageset/star.jpg"
          if [ ! -f "$STAR_JPG" ]; then
            base64 -D -i "$SRCROOT/Sources/App/library-star.jpg.b64" -o "$STAR_JPG" || openssl base64 -d -in "$SRCROOT/Sources/App/library-star.jpg.b64" -out "$STAR_JPG"
          fi
          HERO_JPG="$ASSETS_DIR/LibraryHero.imageset/hero.jpg"
          if [ ! -f "$HERO_JPG" ]; then
            base64 -D -i "$SRCROOT/Sources/App/library-hero.jpg.b64" -o "$HERO_JPG" || openssl base64 -d -in "$SRCROOT/Sources/App/library-hero.jpg.b64" -out "$HERO_JPG"
          fi
    dependencies:
      - target: CocoWallTunnel
        embed: true
      - package: ZIPFoundation
  CocoWallTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.cocowall.Tunnel
        INFOPLIST_FILE: Sources/Tunnel/Info.plist
