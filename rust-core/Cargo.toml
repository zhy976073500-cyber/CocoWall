[package]
name = "cocowall-core"
version = "0.1.0"
edition = "2021"
description = "CocoWall device core: RPPairing host + AirTraffic write channel over the loopback tunnel (own implementation; protocol facts from public sources, see research/)."

[lib]
name = "cocowall_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Transport stack (RSD, lockdown, AFC, RemotePairing, installation proxy,
# diagnostics relay). Pinned to the jkcoxson/idevice v0.1.68 tag so the
# library and its FFI companion crate resolve to one unified instance.
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "d32c8189c51c2789496b0768039419c3705498c3", default-features = false, features = [
  "aws-lc",
  "remote_pairing",
  "tunnel_tcp_stack",
  "rsd",
  "tcp",
  "xpc",
  "core_device_proxy",
  "afc",
  "pair",
  "usbmuxd",
  "installation_proxy",
  "diagnostics_relay",
] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time", "sync"] }
plist = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
libc = "0.2"

[profile.release]
panic = "abort"
opt-level = 2
